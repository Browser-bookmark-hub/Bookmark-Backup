<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Web Snapshot Helper</title>
  <style>
    body {
      background: #fdfdfd;
      font-family: system-ui, sans-serif;
      padding: 40px;
      margin: 0;
      height: 100vh;
      box-sizing: border-box;
      transition: background 0.3s;
    }
    body.dark-mode {
      background: #121212 !important;
      color: white !important;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f0f0f0;
      border-radius: 6px;
    }
    body.dark-mode button {
      background: #333;
      color: white;
      border-color: #555;
    }
  </style>
</head>
<body>
  <h1>Snapshot Helper UI Mock Test</h1>
  <button id="toggle-dark">Toggle Dark Mode Background (Re-open Panel to Refresh Theme)</button>
  <button id="open-panel" style="margin-left: 10px;">Re-open Panel</button>
  <p>The Snapshot Helper panel bubble should load at the bottom-right of the screen.</p>

  <script>
    // 1. Mock Chrome Extension APIs
    const mockStorage = {};
    window.chrome = {
      runtime: {
        sendMessage: (payload, callback) => {
          console.log("Mock sendMessage:", payload);
          if (payload.action === 'dev1SnapshotHelperToggleHighlighter') {
            // Load highlighter styles dynamically
            if (!document.querySelector('link[href*="snapshot_highlighter/styles.css"]')) {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = 'dev_1/snapshot_highlighter/styles.css';
              document.head.appendChild(link);
            }
            
            // Load index.js dynamically if not already loaded
            if (!window.__dev1SnapshotHighlighter) {
              const script = document.createElement('script');
              script.src = 'dev_1/snapshot_highlighter/index.js';
              script.onload = () => {
                window.__dev1SnapshotHighlighter.toggle(payload.item).then(res => {
                  callback(res);
                });
              };
              document.body.appendChild(script);
            } else {
              window.__dev1SnapshotHighlighter.toggle(payload.item).then(res => {
                callback(res);
              });
            }
          } else {
            setTimeout(() => callback({ success: true }), 100);
          }
        },
        lastError: null
      },
      storage: {
        local: {
          get: (keys, callback) => {
            const result = {};
            if (typeof keys === 'string') {
              result[keys] = mockStorage[keys];
            } else if (Array.isArray(keys)) {
              keys.forEach(k => result[k] = mockStorage[k]);
            } else {
              Object.assign(result, mockStorage);
            }
            setTimeout(() => callback(result), 0);
          },
          set: (items, callback) => {
            Object.assign(mockStorage, items);
            if (callback) setTimeout(callback, 0);
          },
          remove: (keys, callback) => {
            if (typeof keys === 'string') {
              delete mockStorage[keys];
            } else if (Array.isArray(keys)) {
              keys.forEach(k => delete mockStorage[k]);
            }
            if (callback) setTimeout(callback, 0);
          }
        }
      }
    };
  </script>

  <!-- Load Tab Scoped Storage Mock -->
  <script src="dev_1/tab_scoped_storage.js"></script>

  <!-- Load Snapshot Helper Script -->
  <script src="dev_1/snapshot_helper_content.js"></script>
  
  <script>
    document.getElementById('toggle-dark').onclick = () => {
      document.body.classList.toggle('dark-mode');
    };
    
    function initPanel() {
      if (window.__dev1SnapshotHelper) {
        console.log("Helper loaded. Opening panel...");
        window.__dev1SnapshotHelper.openPanel({
          lang: 'zh_CN',
          existingTabId: 9999,
          title: 'Mock Page Title',
          url: window.location.href
        });
      } else {
        console.error("Helper script failed to expose global object.");
      }
    }

    document.getElementById('open-panel').onclick = () => {
      if (window.__dev1SnapshotHelper) {
        window.__dev1SnapshotHelper.destroy();
      }
      initPanel();
    };
    
    // Initialize the helper automatically
    setTimeout(initPanel, 500);
  </script>
</body>
</html>
